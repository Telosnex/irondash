name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The Dart package engine_context/dart: format, analyze and its host tests.
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - uses: Telosnex/telosnex_ci_tools/actions/lint@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: engine_context/dart
      - run: flutter pub get
        working-directory: engine_context/dart/example
      # Generated files (first line "// GENERATED ...") keep their generator's
      # layout.
      - name: Format
        run: |
          git ls-files 'engine_context/**.dart' |
            while read -r f; do head -1 "$f" | grep -qiE '^// *generated' || echo "$f"; done |
            xargs dart format --output=none --set-exit-if-changed
      - name: Analyze
        working-directory: engine_context/dart
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: engine_context/dart
        run: flutter test -r expanded

  # The Rust crates of the workspace on Linux: format, clippy for the host and
  # for Android, and the tests.
  desktop-linux-x64:
    name: Linux x64 Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev pkg-config > /dev/null
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Clippy (tests)
        run: cargo clippy --workspace --tests -- -D warnings
      - name: Install the Android target
        run: rustup target add armv7-linux-androideabi
      - name: Clippy (Android)
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT}}"
          NDK_BIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${NDK_BIN}/armv7a-linux-androideabi30-clang" \
          CXX="${NDK_BIN}/armv7a-linux-androideabi30-clang++" \
          AR="${NDK_BIN}/llvm-ar" \
          RANLIB="${NDK_BIN}/llvm-ranlib" \
          cargo clippy --workspace --target=armv7-linux-androideabi -- -D warnings
      - name: Test
        run: cargo test --workspace -- --test-threads=1
