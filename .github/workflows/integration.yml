name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The example app's integration test (engine_context/dart/example) in the
  # test runner of each desktop platform. On macOS and Windows the Rust
  # crates are also clippied and tested for the platform (the steps that are
  # not Linux: Linux runs them in Unit). The jobs share the steps of the first
  # (YAML anchor).
  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEVICE: linux
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb > /dev/null
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - name: Install rustfmt and clippy
        if: runner.os != 'Linux'
        run: rustup component add rustfmt clippy
      - name: Clippy
        if: runner.os != 'Linux'
        run: cargo clippy --workspace -- -D warnings
      - name: Test (Rust)
        if: runner.os != 'Linux'
        run: cargo test --workspace -- --test-threads=1
      - run: flutter pub get
        working-directory: engine_context/dart
      - run: flutter pub get
        working-directory: engine_context/dart/example
      - name: Example integration tests
        working-directory: engine_context/dart/example
        run: |
          run=(flutter test integration_test/engine_context_test.dart -d "$DEVICE" -r expanded)
          if [[ "$RUNNER_OS" == Linux ]]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

  desktop-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      DEVICE: linux
    steps: *desktop_steps

  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVICE: macos
    steps: *desktop_steps

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DEVICE: windows
    steps: *desktop_steps

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: engine_context/dart
      - run: flutter pub get
        working-directory: engine_context/dart/example
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        id: simulator
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        with:
          working-directory: engine_context/dart/example
          target: integration_test/engine_context_test.dart
          udid: ${{ steps.simulator.outputs.udid }}
          artifact-name: ios-simulator-logs

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: engine_context/dart
      - run: flutter pub get
        working-directory: engine_context/dart/example
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        id: emulator
      - name: Example integration tests
        working-directory: engine_context/dart/example
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
        run: flutter test integration_test/engine_context_test.dart -d "$SERIAL" -r expanded
      - name: Upload the emulator logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore
